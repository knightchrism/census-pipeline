<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Florida Census Globe card</title>
  <link rel="stylesheet" href="/static/card.css">
</head>
<body>
  <main id="card">
    <svg id="scene" viewBox="0 0 640 640" role="img" aria-label="Florida counties on a globe"></svg>
    <div class="copy">
      <p class="kicker">GeoKnight GIS</p>
      <h1>Florida Census Globe</h1>
      <p class="deck" id="deck">67 counties. Two ACS 5-year vintages, with margins of error.</p>
      <div class="chips" id="chips"></div>
      <div class="stats" id="stats"></div>
      <p class="fine" id="fine"></p>
      <p class="mark">© GeoKnight GIS. All rights reserved.</p>
    </div>
  </main>
  <script src="/static/card.js"></script>
</body>
</html>
