[project]
name = "census-pipeline"
license = { text = "Proprietary" }
version = "1.0.0"
description = "Census API -> DuckDB -> dbt -> MCP server, with a Florida county census globe"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "duckdb>=1.1",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "dbt-duckdb>=1.9",
  "mcp>=1.2,<2",  # FastMCP API; mcp 2.x renamed it to MCPServer
]

[project.scripts]
census-ingest = "census_ingest.cli:main"
census-mcp = "census_mcp.server:main"
census-globe = "census_globe.server:main"
census-globe-export = "census_globe.export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/census_ingest", "src/census_mcp", "src/census_globe"]

[dependency-groups]
dev = [
    "pyshp>=3.1.7",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
